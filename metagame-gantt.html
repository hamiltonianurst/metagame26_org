<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metagame 2026 — Gantt</title>
<style>html, body, #root { margin: 0; padding: 0; min-height: 100%; } body { background: #24402F; }</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

/* Storage shim: uses Claude's artifact storage when available, otherwise
   the browser's localStorage (GitHub Pages, local file, etc). */
const appStorage = (typeof window !== "undefined" && window.storage)
  ? window.storage
  : {
      get: async (k) => {x
        const v = localStorage.getItem(k);
        return v == null ? null : { key: k, value: v };
      },
      set: async (k, v) => {
        localStorage.setItem(k, String(v));
        return { key: k, value: v };
      },
    };

const { useState, useEffect, useRef } = React;

/* ---------- helpers ---------- */

const uid = () => Math.random().toString(36).slice(2, 10);

/* Same eight colors as the org chart's team palette */
const PALETTE = ["#3E7CB1", "#6B4FA0", "#2E8B74", "#C2703D", "#B5486B", "#7A8B3F", "#4B6584", "#8A5A44"];

const DAY = 86400000;
const parseDate = (s) => new Date(s + "T00:00:00");
const toISO = (dt) => {
  const y = dt.getFullYear(), m = String(dt.getMonth() + 1).padStart(2, "0"), d = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
};
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / DAY);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const seedData = () => {
  const t = (name, color) => ({ id: uid(), name, color });
  const megagame = t("Megagame", "#6B4FA0");
  const ops = t("Operations", "#4B6584");
  const speakers = t("Speakers/Program", "#3E7CB1");
  const volunteers = t("Volunteers", "#7A8B3F");
  const venue = t("Venue", "#C2703D");
  const web = t("Web", "#2E8B74");
  const marketing = t("Marketing", "#B5486B");
  const community = t("Community Health", "#8A5A44");
  const p = (name, teamIds, start, end, notes = "") => ({ id: uid(), name, teamIds, start, end, notes });
  return {
    rangeStart: "2026-08-01",
    rangeEnd: "2026-11-15",
    teams: [megagame, ops, speakers, volunteers, venue, web, marketing, community],
    projects: [
      p("Sponsorship outreach", [marketing.id], "2026-08-03", "2026-10-02"),
      p("Speaker invitations & program", [speakers.id], "2026-08-10", "2026-10-09"),
      p("Megagame design & playtests", [megagame.id], "2026-08-03", "2026-10-30"),
      p("Volunteer recruitment", [volunteers.id], "2026-08-17", "2026-10-16"),
      p("Website & ticket sales", [web.id, marketing.id], "2026-08-03", "2026-11-05"),
      p("Venue logistics & housing", [venue.id], "2026-09-07", "2026-11-05"),
      p("Social media push", [marketing.id], "2026-09-14", "2026-11-05"),
      p("Con weekend", [ops.id, venue.id, volunteers.id], "2026-11-06", "2026-11-08"),
    ],
  };
};

const barBackground = (colors) => {
  if (colors.length === 0) return "#9AA39B";
  if (colors.length === 1) return colors[0];
  const step = 100 / colors.length;
  const stops = colors.map((c, i) => `${c} ${Math.round(i * step)}% ${Math.round((i + 1) * step)}%`).join(", ");
  return `linear-gradient(180deg, ${stops})`;
};

/* ---------- modals ---------- */

const overlayStyle = { position: "fixed", inset: 0, background: "rgba(15,25,19,0.6)", display: "grid", placeItems: "center", padding: 16, zIndex: 50 };
const panelStyle = { background: "var(--card)", borderRadius: 12, padding: 18, width: "100%", maxWidth: 400, boxShadow: "0 10px 30px rgba(0,0,0,0.4)", maxHeight: "88vh", overflowY: "auto" };
const inputStyle = {
  width: "100%", boxSizing: "border-box", border: "1.5px solid var(--line)", borderRadius: 6,
  padding: "8px 10px", fontSize: 14, fontFamily: "inherit", background: "#fff", color: "var(--ink)", outline: "none",
};
const labelStyle = {
  fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700,
  color: "var(--muted)", display: "block", marginBottom: 4,
};
const btnDark = { background: "var(--ink)", color: "var(--card)", border: "none", borderRadius: 6, padding: "9px 14px", fontSize: 13.5, fontWeight: 700, cursor: "pointer" };
const btnGhost = { background: "transparent", color: "var(--muted)", border: "1.5px solid var(--line)", borderRadius: 6, padding: "9px 14px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" };

function ProjectModal({ project, teams, onSave, onDelete, onClose }) {
  const [name, setName] = useState(project.name);
  const [start, setStart] = useState(project.start);
  const [end, setEnd] = useState(project.end);
  const [teamIds, setTeamIds] = useState(project.teamIds || []);
  const [notes, setNotes] = useState(project.notes || "");
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [err, setErr] = useState("");
  const nameRef = useRef(null);
  useEffect(() => { nameRef.current?.focus(); }, []);

  const toggleTeam = (id) => {
    setTeamIds((ids) => {
      if (ids.includes(id)) return ids.filter((x) => x !== id);
      if (ids.length >= 3) return ids; // max 3 teams
      return [...ids, id];
    });
  };

  const save = () => {
    if (!name.trim()) { setErr("Give the project a name."); return; }
    if (!start || !end || parseDate(end) < parseDate(start)) { setErr("End date must be on or after the start date."); return; }
    onSave({ name: name.trim(), start, end, teamIds, notes: notes.trim() });
  };

  return (
    <div onClick={onClose} style={overlayStyle}>
      <div onClick={(e) => e.stopPropagation()} style={panelStyle}>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div>
            <label style={labelStyle}>Project</label>
            <input ref={nameRef} style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Project name" />
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <label style={labelStyle}>Start</label>
              <input type="date" style={inputStyle} value={start} onChange={(e) => setStart(e.target.value)} />
            </div>
            <div style={{ flex: 1 }}>
              <label style={labelStyle}>End</label>
              <input type="date" style={inputStyle} value={end} onChange={(e) => setEnd(e.target.value)} />
            </div>
          </div>
          <div>
            <label style={labelStyle}>Teams — up to 3, bar is striped when shared</label>
            <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              {teams.map((t) => {
                const on = teamIds.includes(t.id);
                const full = !on && teamIds.length >= 3;
                return (
                  <button
                    key={t.id}
                    onClick={() => toggleTeam(t.id)}
                    disabled={full}
                    style={{
                      display: "flex", alignItems: "center", gap: 8, textAlign: "left",
                      background: on ? "rgba(34,38,31,0.06)" : "transparent",
                      border: on ? "1.5px solid var(--ink)" : "1.5px solid var(--line)",
                      borderRadius: 6, padding: "6px 9px", cursor: full ? "not-allowed" : "pointer",
                      opacity: full ? 0.45 : 1, fontSize: 13, color: "var(--ink)", fontWeight: on ? 700 : 500,
                    }}
                  >
                    <span style={{ width: 14, height: 14, borderRadius: 4, background: t.color, flexShrink: 0 }} />
                    {t.name}
                    {on && <span style={{ marginLeft: "auto" }}>✓</span>}
                  </button>
                );
              })}
              {teams.length === 0 && <span style={{ fontSize: 12.5, color: "var(--muted)" }}>No teams yet — add them under "Teams".</span>}
            </div>
          </div>
          <div>
            <label style={labelStyle}>Notes</label>
            <textarea style={{ ...inputStyle, minHeight: 56, resize: "vertical" }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Optional details" />
          </div>
          {err && <div style={{ fontSize: 12.5, color: "var(--red)", fontWeight: 600 }}>{err}</div>}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button style={btnDark} onClick={save}>Save project</button>
            <button style={btnGhost} onClick={onClose}>Cancel</button>
          </div>
          {onDelete && (
            <div style={{ borderTop: "1px dashed rgba(34,38,31,0.2)", paddingTop: 10 }}>
              {confirmDelete ? (
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ fontSize: 13, color: "var(--red)", fontWeight: 700 }}>Delete this project?</span>
                  <button style={{ ...btnDark, background: "var(--red)" }} onClick={onDelete}>Yes, delete</button>
                  <button style={btnGhost} onClick={() => setConfirmDelete(false)}>No</button>
                </div>
              ) : (
                <button style={{ ...btnGhost, color: "var(--red)", border: "none", padding: "4px 0" }} onClick={() => setConfirmDelete(true)}>
                  Delete this project…
                </button>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TeamsModal({ teams, onChange, onSyncFromOrg, syncMessage, onClose }) {
  return (
    <div onClick={onClose} style={overlayStyle}>
      <div onClick={(e) => e.stopPropagation()} style={panelStyle}>
        <div style={{ fontFamily: "var(--display)", fontWeight: 800, fontSize: 16, color: "var(--ink)", marginBottom: 10 }}>Teams</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {teams.map((t) => (
            <div key={t.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input
                type="color"
                value={t.color}
                onChange={(e) => onChange(teams.map((x) => (x.id === t.id ? { ...x, color: e.target.value } : x)))}
                style={{ width: 34, height: 32, border: "1.5px solid var(--line)", borderRadius: 6, background: "#fff", cursor: "pointer", padding: 1, flexShrink: 0 }}
              />
              <input
                style={{ ...inputStyle, flex: 1 }}
                value={t.name}
                onChange={(e) => onChange(teams.map((x) => (x.id === t.id ? { ...x, name: e.target.value } : x)))}
              />
              <button
                onClick={() => onChange(teams.filter((x) => x.id !== t.id))}
                title="Remove team"
                style={{ ...btnGhost, padding: "7px 10px", color: "var(--red)" }}
              >
                ✕
              </button>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
          <button
            style={btnGhost}
            onClick={() => onChange([...teams, { id: uid(), name: "New team", color: PALETTE[teams.length % PALETTE.length] }])}
          >
            + Add team
          </button>
          <button style={btnGhost} onClick={onSyncFromOrg}>Sync from org chart</button>
          <button style={btnDark} onClick={onClose}>Done</button>
        </div>
        {syncMessage && <div style={{ marginTop: 10, fontSize: 12.5, color: "var(--muted)", lineHeight: 1.5 }}>{syncMessage}</div>}
        <p style={{ margin: "10px 0 0", fontSize: 11.5, color: "var(--muted)", lineHeight: 1.5 }}>
          Removing a team also clears it from any projects. "Sync from org chart" pulls the team leads and their colors from the org chart page when both live on the same site.
        </p>
      </div>
    </div>
  );
}

function DataModal({ text, onImport, onClose }) {
  const [value, setValue] = useState(text);
  const [err, setErr] = useState("");
  const [copied, setCopied] = useState(false);
  const areaRef = useRef(null);

  const tryCopy = async () => {
    let ok = false;
    try {
      await navigator.clipboard.writeText(value);
      ok = true;
    } catch {
      try {
        if (areaRef.current) { areaRef.current.focus(); areaRef.current.select(); ok = document.execCommand("copy"); }
      } catch { ok = false; }
    }
    if (ok) { setCopied(true); setTimeout(() => setCopied(false), 1600); }
    else if (areaRef.current) { areaRef.current.focus(); areaRef.current.select(); }
  };

  return (
    <div onClick={onClose} style={overlayStyle}>
      <div onClick={(e) => e.stopPropagation()} style={panelStyle}>
        <div style={{ fontFamily: "var(--display)", fontWeight: 800, fontSize: 16, color: "var(--ink)", marginBottom: 6 }}>Backup & transfer</div>
        <p style={{ margin: "0 0 10px", fontSize: 13, color: "var(--muted)", lineHeight: 1.5 }}>
          Copy this to save the whole chart, or paste a saved backup and load it.
        </p>
        <textarea
          ref={areaRef}
          value={value}
          onChange={(e) => setValue(e.target.value)}
          onFocus={(e) => e.target.select()}
          style={{ ...inputStyle, minHeight: 200, fontFamily: "ui-monospace, monospace", fontSize: 11.5, resize: "vertical" }}
        />
        {err && <div style={{ marginTop: 8, fontSize: 12.5, color: "var(--red)", fontWeight: 600 }}>{err}</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
          <button style={btnDark} onClick={tryCopy}>{copied ? "Copied ✓" : "Copy"}</button>
          <button
            style={btnGhost}
            onClick={() => {
              try {
                const parsed = JSON.parse(value);
                if (!parsed || !Array.isArray(parsed.projects) || !Array.isArray(parsed.teams)) throw 0;
                onImport(parsed);
              } catch {
                setErr("That doesn't look like a backup from this chart — paste the full copied text.");
              }
            }}
          >
            Load this data
          </button>
          <button style={btnGhost} onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- app ---------- */

const STORAGE_KEY = "metagame_gantt_v1";
const ORG_STORAGE_KEY = "metagame_org_chart_v1";

function GanttChart() {
  const [data, setData] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [creating, setCreating] = useState(false);
  const [teamsOpen, setTeamsOpen] = useState(false);
  const [dataOpen, setDataOpen] = useState(false);
  const [syncMessage, setSyncMessage] = useState("");
  const [status, setStatus] = useState("loading");
  const [confirmReset, setConfirmReset] = useState(false);
  const saveTimer = useRef(null);
  const loaded = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const result = await appStorage.get(STORAGE_KEY);
        if (result && result.value) setData(JSON.parse(result.value));
        else setData(seedData());
      } catch {
        setData(seedData());
      }
      loaded.current = true;
      setStatus("ready");
    })();
  }, []);

  useEffect(() => {
    if (!loaded.current || !data) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await appStorage.set(STORAGE_KEY, JSON.stringify(data));
        setStatus("ready");
      } catch {
        setStatus("unsaved-warning");
      }
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  if (!data) {
    return (
      <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", background: "#24402F", color: "#FAF7F0", fontFamily: "system-ui, sans-serif" }}>
        Setting up the table…
      </div>
    );
  }

  const { teams, projects, rangeStart, rangeEnd } = data;
  const totalDays = Math.max(1, daysBetween(rangeStart, rangeEnd));
  const pct = (dateStr) => Math.min(100, Math.max(0, (daysBetween(rangeStart, dateStr) / totalDays) * 100));
  const teamById = (id) => teams.find((t) => t.id === id);

  const setTeams = (nextTeams) => {
    const keep = new Set(nextTeams.map((t) => t.id));
    setData((d) => ({
      ...d,
      teams: nextTeams,
      projects: d.projects.map((p) => ({ ...p, teamIds: p.teamIds.filter((id) => keep.has(id)) })),
    }));
  };

  const saveProject = (id, patch) => {
    setData((d) => ({ ...d, projects: d.projects.map((p) => (p.id === id ? { ...p, ...patch } : p)) }));
    setSelectedId(null);
  };
  const addProject = (patch) => {
    setData((d) => ({ ...d, projects: [...d.projects, { id: uid(), ...patch }] }));
    setCreating(false);
  };
  const deleteProject = (id) => {
    setData((d) => ({ ...d, projects: d.projects.filter((p) => p.id !== id) }));
    setSelectedId(null);
  };

  const syncFromOrg = async () => {
    try {
      const res = await appStorage.get(ORG_STORAGE_KEY);
      if (!res || !res.value) throw 0;
      const parsed = JSON.parse(res.value);
      const tree = parsed.tree || parsed;
      const lead = tree && tree.children && tree.children[0];
      const leads = lead && lead.children ? lead.children : [];
      if (!leads.length) throw 0;
      const oldByName = new Map(teams.map((t) => [t.name.trim().toLowerCase(), t.id]));
      const next = leads.map((n, i) => {
        const existingId = oldByName.get(n.title.trim().toLowerCase());
        return { id: existingId || uid(), name: n.title, color: n.color || PALETTE[i % PALETTE.length] };
      });
      setTeams(next);
      setSyncMessage(`Pulled ${next.length} teams from the org chart. Projects assigned to same-named teams kept their assignments.`);
    } catch {
      setSyncMessage("No org chart data found here. On a hosted site the two pages share storage automatically; inside Claude each page keeps its own, so set teams manually or match the colors by eye.");
    }
  };

  const reset = () => {
    setData(seedData());
    setSelectedId(null);
    setCreating(false);
    setConfirmReset(false);
  };

  /* month header segments */
  const months = [];
  {
    let cur = parseDate(rangeStart);
    cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const endD = parseDate(rangeEnd);
    while (cur <= endD) {
      const monthEnd = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
      const segStart = toISO(cur < parseDate(rangeStart) ? parseDate(rangeStart) : cur);
      const segEnd = toISO(monthEnd > endD ? endD : monthEnd);
      months.push({ label: MONTHS[cur.getMonth()], left: pct(segStart), width: Math.max(0, pct(segEnd) - pct(segStart)) });
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
  }

  /* weekly gridlines (Mondays) */
  const weekLines = [];
  {
    let cur = parseDate(rangeStart);
    while (cur.getDay() !== 1) cur = new Date(cur.getTime() + DAY);
    const endD = parseDate(rangeEnd);
    while (cur <= endD) {
      weekLines.push(pct(toISO(cur)));
      cur = new Date(cur.getTime() + 7 * DAY);
    }
  }

  const todayISO = toISO(new Date());
  const todayPct = daysBetween(rangeStart, todayISO) >= 0 && daysBetween(todayISO, rangeEnd) >= 0 ? pct(todayISO) : null;

  const sorted = [...projects].sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : a.name.localeCompare(b.name)));
  const selected = selectedId ? projects.find((p) => p.id === selectedId) : null;

  const smallBtn = {
    background: "transparent", color: "var(--paper)", border: "1.5px solid rgba(250,247,240,0.35)",
    borderRadius: 6, padding: "6px 11px", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
  };
  const dateInput = {
    background: "transparent", color: "var(--paper)", border: "1.5px solid rgba(250,247,240,0.35)",
    borderRadius: 6, padding: "4px 6px", fontSize: 12, fontFamily: "inherit", colorScheme: "dark",
  };

  return (
    <div
      style={{
        "--felt": "#24402F",
        "--card": "#FAF7F0",
        "--paper": "#FAF7F0",
        "--ink": "#22261F",
        "--muted": "#5C6657",
        "--red": "#BC4B33",
        "--gold": "#C99A3C",
        "--line": "rgba(34,38,31,0.25)",
        "--display": "'Archivo', 'Avenir Next', 'Segoe UI', system-ui, sans-serif",
        minHeight: "100vh",
        background: "var(--felt)",
        backgroundImage: "radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px)",
        backgroundSize: "22px 22px",
        fontFamily: "'Public Sans', 'Segoe UI', system-ui, sans-serif",
        display: "flex",
        flexDirection: "column",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap');
        button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid #C99A3C; outline-offset: 1px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      <header style={{ color: "var(--paper)", padding: "22px 16px 14px", maxWidth: 1000, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
        <div style={{ fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", opacity: 0.75, fontWeight: 700 }}>
          Metagame 2026
        </div>
        <h1 style={{ fontFamily: "var(--display)", fontWeight: 800, fontSize: 26, margin: "3px 0 4px", lineHeight: 1.1 }}>
          Road to the con
        </h1>
        <p style={{ margin: 0, fontSize: 13, opacity: 0.8, lineHeight: 1.5 }}>
          Tap a bar to edit its project. Bars carry their team's color — striped when two or three teams share the work.
        </p>
        <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap", alignItems: "center" }}>
          <button style={{ ...smallBtn, background: "var(--paper)", color: "var(--ink)" }} onClick={() => setCreating(true)}>+ Add project</button>
          <button style={smallBtn} onClick={() => { setTeamsOpen(true); setSyncMessage(""); }}>Teams</button>
          <button style={smallBtn} onClick={() => setDataOpen(true)}>Backup / load</button>
          {confirmReset ? (
            <span style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12.5 }}>
              <span>Discard all changes?</span>
              <button style={{ ...smallBtn, background: "var(--red)", borderColor: "var(--red)", color: "#fff" }} onClick={reset}>Reset</button>
              <button style={smallBtn} onClick={() => setConfirmReset(false)}>Keep</button>
            </span>
          ) : (
            <button style={smallBtn} onClick={() => setConfirmReset(true)}>Reset</button>
          )}
          {typeof window !== "undefined" && !window.storage && (
            <a href="index.html" style={{ ...smallBtn, textDecoration: "none", display: "inline-block", boxSizing: "border-box" }}>
              Org chart →
            </a>
          )}
          <span style={{ display: "flex", gap: 5, alignItems: "center", marginLeft: "auto", fontSize: 12 }}>
            <input type="date" style={dateInput} value={rangeStart} onChange={(e) => e.target.value && setData((d) => ({ ...d, rangeStart: e.target.value }))} />
            →
            <input type="date" style={dateInput} value={rangeEnd} onChange={(e) => e.target.value && setData((d) => ({ ...d, rangeEnd: e.target.value }))} />
          </span>
          {status === "unsaved-warning" && (
            <span style={{ fontSize: 12, color: "#F0C9A8" }}>Couldn't save — changes live only in this session</span>
          )}
        </div>
        {/* team legend */}
        <div style={{ display: "flex", gap: 12, marginTop: 10, flexWrap: "wrap", fontSize: 11.5, opacity: 0.9 }}>
          {teams.map((t) => (
            <span key={t.id} style={{ display: "flex", alignItems: "center", gap: 5 }}>
              <span style={{ width: 11, height: 11, borderRadius: 3, background: t.color, display: "inline-block" }} />
              {t.name}
            </span>
          ))}
        </div>
      </header>

      {/* chart */}
      <div style={{ flex: 1, overflowX: "auto", padding: "6px 16px 60px", WebkitOverflowScrolling: "touch" }}>
        <div style={{ minWidth: 680, maxWidth: 1000, margin: "0 auto" }}>
          {/* month header */}
          <div style={{ position: "relative", height: 24, borderBottom: "2px solid rgba(250,247,240,0.35)" }}>
            {months.map((m, i) => (
              <span
                key={i}
                style={{
                  position: "absolute", left: `${m.left}%`, width: `${m.width}%`, bottom: 3,
                  color: "var(--paper)", fontSize: 11.5, fontWeight: 700, letterSpacing: "0.12em",
                  textTransform: "uppercase", textAlign: "center", overflow: "hidden", whiteSpace: "nowrap",
                  borderLeft: i > 0 ? "1px solid rgba(250,247,240,0.35)" : "none",
                }}
              >
                {m.width > 6 ? m.label : ""}
              </span>
            ))}
          </div>

          {/* rows */}
          <div style={{ position: "relative", paddingTop: 4 }}>
            {/* weekly gridlines */}
            {weekLines.map((l, i) => (
              <span key={i} aria-hidden style={{ position: "absolute", top: 0, bottom: 0, left: `${l}%`, width: 1, background: "rgba(250,247,240,0.12)" }} />
            ))}
            {/* today marker */}
            {todayPct !== null && (
              <>
                <span aria-hidden style={{ position: "absolute", top: 0, bottom: 0, left: `${todayPct}%`, width: 2, background: "var(--gold)", zIndex: 2 }} />
                <span style={{ position: "absolute", top: -2, left: `${todayPct}%`, transform: "translateX(-50%)", background: "var(--gold)", color: "#22261F", fontSize: 9.5, fontWeight: 800, borderRadius: 4, padding: "1px 5px", zIndex: 3, letterSpacing: "0.06em" }}>
                  TODAY
                </span>
              </>
            )}

            {sorted.map((p) => {
              const left = pct(p.start);
              const right = pct(toISO(new Date(parseDate(p.end).getTime() + DAY))); // bar covers the end day
              const width = Math.max(1.2, right - left);
              const colors = p.teamIds.map((id) => teamById(id)).filter(Boolean).map((t) => t.color);
              const wide = width >= 22;
              return (
                <div key={p.id} style={{ position: "relative", height: 42 }}>
                  <div
                    onClick={() => setSelectedId(p.id)}
                    role="button"
                    tabIndex={0}
                    onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSelectedId(p.id); } }}
                    title={`${p.name}: ${p.start} → ${p.end}`}
                    style={{
                      position: "absolute", left: `${left}%`, width: `${width}%`, top: 7, height: 28,
                      background: barBackground(colors),
                      borderRadius: 7, border: "1px solid rgba(0,0,0,0.35)", boxShadow: "0 2px 0 rgba(0,0,0,0.3)",
                      cursor: "pointer", display: "flex", alignItems: "center", padding: "0 8px", boxSizing: "border-box",
                      overflow: "hidden", zIndex: 1,
                    }}
                  >
                    {wide && (
                      <span style={{ color: "#fff", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textShadow: "0 1px 2px rgba(0,0,0,0.55)" }}>
                        {p.name}
                      </span>
                    )}
                  </div>
                  {!wide && (
                    <span
                      onClick={() => setSelectedId(p.id)}
                      style={{
                        position: "absolute", left: `calc(${Math.min(left + width, 100)}% + 6px)`, top: 12,
                        color: "var(--paper)", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap", cursor: "pointer", zIndex: 1,
                      }}
                    >
                      {p.name}
                    </span>
                  )}
                </div>
              );
            })}
            {sorted.length === 0 && (
              <p style={{ color: "var(--paper)", opacity: 0.7, fontSize: 13, textAlign: "center", padding: "30px 0" }}>
                No projects yet — tap "+ Add project" to put the first bar on the timeline.
              </p>
            )}
          </div>
        </div>
      </div>

      {(selected || creating) && (
        <ProjectModal
          project={selected || { name: "", start: rangeStart, end: rangeEnd, teamIds: [], notes: "" }}
          teams={teams}
          onSave={(patch) => (selected ? saveProject(selected.id, patch) : addProject(patch))}
          onDelete={selected ? () => deleteProject(selected.id) : null}
          onClose={() => { setSelectedId(null); setCreating(false); }}
        />
      )}

      {teamsOpen && (
        <TeamsModal
          teams={teams}
          onChange={setTeams}
          onSyncFromOrg={syncFromOrg}
          syncMessage={syncMessage}
          onClose={() => setTeamsOpen(false)}
        />
      )}

      {dataOpen && (
        <DataModal
          text={JSON.stringify(data, null, 2)}
          onImport={(parsed) => { setData(parsed); setDataOpen(false); }}
          onClose={() => setDataOpen(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GanttChart />);
</script>
</body>
</html>
